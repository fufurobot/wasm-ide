<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>wasm-ide · React consumer fixture</title>
    <style>
      body {
        margin: 0;
        background: #18181b;
      }
      #root {
        height: 100vh;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom": "https://esm.sh/react-dom@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
          "@runno/runtime": "https://esm.sh/@runno/runtime@0.10.0",
          "@monaco-editor/react": "https://esm.sh/@monaco-editor/react@4.7.0?bundle=&external=react,react-dom"
        }
      }
    </script>
  </head>
  <body>
    <!--
      A React consumer. This fixture deliberately imports React from a CDN via
      an import map rather than bundling, so it exercises the published
      `index.js` with React left EXTERNAL - the way a consumer's own bundler
      would resolve it.

      Nothing here is built: it is exactly what a third party would ship.
    -->
    <div id="root"></div>

    <script>
      // A CDN hiccup should read as a visible error, not a blank page.
      window.addEventListener("error", event => {
        const box = document.createElement("pre");
        box.dataset.testid = "boot-error";
        box.style.cssText = "color:#f87171;padding:16px;font:12px monospace;white-space:pre-wrap";
        box.textContent = "boot error: " + (event.message || event.error);
        document.body.appendChild(box);
      });
    </script>

    <script type="module">
      import { createElement } from "react";
      import { createRoot } from "react-dom/client";
      import { WasmIDE } from "/dist-lib/index.js";

      // ?lang=c switches the fixture to the C sample.
      const params = new URLSearchParams(location.search);
      const language = params.get("lang") ?? undefined;

      createRoot(document.getElementById("root")).render(
        createElement(WasmIDE, {
          language,
          height: "100vh",
          showShareButton: false,
        }),
      );
    </script>
  </body>
</html>
