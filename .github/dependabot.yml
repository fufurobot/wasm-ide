# Dependabot configuration.
#
# The token used by the agent tooling has `contents:write`, so configuring
# Dependabot is permitted (verified with `python3 tools/gh.py dependabot-check`).
#
# Updates target `dev`, not `main`: the branch model is "fast test on dev, full
# test on main", so dependency churn should prove itself on dev first and only
# reach main through a merged sprint.
version: 2
updates:
  # npm/bun dependencies
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: scope
    labels:
      - dependencies
    groups:
      # Group the noisy ones so they land as a single reviewable PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      radix-ui:
        patterns:
          - "@radix-ui/*"
          - "radix-ui"
      tooling:
        patterns:
          - "typescript"
          - "tailwindcss"
          - "bun-plugin-tailwind"
          - "@types/bun"

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: scope
    labels:
      - dependencies
      - github-actions
