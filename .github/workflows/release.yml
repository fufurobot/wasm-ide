# Publish artifacts when a release is pushed.
#
# Branch model: fast test on dev, full test on main, publish artifacts when a
# release is pushed. The release tag defines the version, so the artifact and
# the released source can never drift apart.
name: Release (publish artifacts)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required by `npm publish` to GitHub Packages.
  packages: write

jobs:
  publish:
    name: Build and attach artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The release tag is the source of truth for the package version, so the
      # published tarball and the GitHub Release can never disagree.
      - name: Set package version from the release tag
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -eu
          # v1.2.3 -> 1.2.3
          CLEAN="${VERSION#v}"
          if ! printf '%s' "$CLEAN" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::release tag '$VERSION' is not semver (expected vX.Y.Z)"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$CLEAN"
          echo "package version set to $CLEAN"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test:unit

      - name: Build static bundle
        run: bun run build

      # Runs after the build: these tests inspect dist/ and would fail on
      # ordering, not correctness, if they ran in the unit phase.
      - name: Built-bundle tests
        run: bun run test:dist

      - name: Assert the isolation worker shipped
        run: |
          set -eu
          test -f dist/coi-serviceworker.js || {
            echo "::error::dist/coi-serviceworker.js is missing; the deployed site cannot become cross-origin isolated"
            exit 1
          }
          grep -q "coi-serviceworker" dist/index.html || {
            echo "::error::the isolation bootstrap is not inlined in dist/index.html"
            exit 1
          }
          echo "isolation worker and bootstrap present"

      - name: Assert no credentials leaked into the bundle
        run: |
          set -eu
          if grep -rIl -E 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}' dist/; then
            echo "::error::a credential-shaped string was found in dist/"
            exit 1
          fi
          echo "dist/ is free of credential-shaped strings"

      # ---- npm package -------------------------------------------------------
      - name: Build the library
        run: bun run build:lib

      - name: Assert the library entries and declarations exist
        run: |
          set -eu
          for f in index.js index.cjs index.d.ts vanilla.js vanilla.cjs vanilla.d.ts \
                   types/lib/ide.d.ts coi-serviceworker.js; do
            test -f "dist-lib/$f" || { echo "::error::dist-lib/$f is missing"; exit 1; }
          done
          # A bare specifier in the vanilla build breaks consumers without a bundler.
          if grep -nE '^import [^;]*from ?"[^.@/]|^import [^;]*from ?"@' dist-lib/vanilla.js | grep -v '@@'; then
            echo "::error::vanilla.js contains a bare module specifier; a page without a bundler cannot resolve it"
            exit 1
          fi
          # Consumers have no "@/" alias.
          if grep -rl 'from "@/' dist-lib/ --include='*.d.ts'; then
            echo "::error::declarations contain the project path alias '@/...'"
            exit 1
          fi
          echo "library build looks correct"

      - name: Library tests
        run: bun run test:unit

      # ---- artifacts ---------------------------------------------------------
      - name: Package the static site
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -eu
          tar -czf "wasm-ide-${VERSION}-dist.tar.gz" -C dist .
          sha256sum "wasm-ide-${VERSION}-dist.tar.gz" > "wasm-ide-${VERSION}-dist.tar.gz.sha256"
          ls -lh wasm-ide-*

      - name: Attach artifacts to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wasm-ide-*-dist.tar.gz
            wasm-ide-*-dist.tar.gz.sha256

      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # GITHUB_TOKEN can publish to this repo's namespace in Actions, so no
          # long-lived PAT secret is needed in CI.
          cat > .npmrc <<EOF
          @fufurobot:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}
          EOF
          npm publish

      - name: Pack the library for tag-only pushes
        if: github.event_name != 'release'
        run: bun run build:lib && npm pack

      - name: Upload artifacts for tag-only pushes
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: wasm-ide-dist-${{ github.ref_name }}
          path: |
            wasm-ide-*-dist.tar.gz*
            fufurobot-wasm-ide-*.tgz
          retention-days: 30
