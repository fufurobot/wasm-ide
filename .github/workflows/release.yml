# Publish artifacts when a release is pushed.
#
# Branch model: fast test on dev, full test on main, publish artifacts when a
# release is pushed. The release tag defines the version, so the artifact and
# the released source can never drift apart.
name: Release (publish artifacts)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and attach artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test:unit

      - name: Build static bundle
        run: bun run build

      # Runs after the build: these tests inspect dist/ and would fail on
      # ordering, not correctness, if they ran in the unit phase.
      - name: Built-bundle tests
        run: bun run test:dist

      - name: Assert the isolation worker shipped
        run: |
          set -eu
          test -f dist/coi-serviceworker.js || {
            echo "::error::dist/coi-serviceworker.js is missing; the deployed site cannot become cross-origin isolated"
            exit 1
          }
          grep -q "coi-serviceworker" dist/index.html || {
            echo "::error::the isolation bootstrap is not inlined in dist/index.html"
            exit 1
          }
          echo "isolation worker and bootstrap present"

      - name: Assert no credentials leaked into the bundle
        run: |
          set -eu
          if grep -rIl -E 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}' dist/; then
            echo "::error::a credential-shaped string was found in dist/"
            exit 1
          fi
          echo "dist/ is free of credential-shaped strings"

      - name: Package the static site
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -eu
          tar -czf "wasm-ide-${VERSION}-dist.tar.gz" -C dist .
          sha256sum "wasm-ide-${VERSION}-dist.tar.gz" > "wasm-ide-${VERSION}-dist.tar.gz.sha256"
          ls -lh wasm-ide-*

      - name: Attach artifacts to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wasm-ide-*-dist.tar.gz
            wasm-ide-*-dist.tar.gz.sha256

      - name: Upload artifacts for tag-only pushes
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-ide-dist-${{ github.ref_name }}
          path: wasm-ide-*-dist.tar.gz*
          retention-days: 30
