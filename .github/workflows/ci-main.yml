# Full verification for `main`, and deployment to GitHub Pages.
#
# This is the gate that must be green. It runs the unit suite, a production
# build, and the whole Playwright end-to-end suite against the *built* static
# bundle served by src/preview.ts — the same shape GitHub Pages uses, so a
# passing run here means the published site actually works.
#
# On a push to main (i.e. a merged sprint) the verified dist/ is also published
# to Pages.
name: CI (main full) + Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    name: Typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Build static bundle
        run: bun run build

      - name: Assert the isolation worker shipped
        run: |
          set -eu
          test -f dist/coi-serviceworker.js || {
            echo "::error::dist/coi-serviceworker.js is missing; the deployed site cannot become cross-origin isolated"
            exit 1
          }
          grep -q "coi-serviceworker" dist/index.html || {
            echo "::error::the isolation bootstrap is not inlined in dist/index.html"
            exit 1
          }
          echo "isolation worker and bootstrap present"

      - name: Assert no credentials leaked into the bundle
        run: |
          set -eu
          if grep -rIl -E 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}' dist/; then
            echo "::error::a credential-shaped string was found in dist/"
            exit 1
          fi
          echo "dist/ is free of credential-shaped strings"

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Start static preview of dist/
        run: |
          bun run preview > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "preview is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::preview server did not come up"
          cat /tmp/preview.log
          exit 1

      - name: End-to-end tests against the built bundle
        run: bunx playwright test
        env:
          PW_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: dist-main-${{ github.sha }}
          path: dist/
          retention-days: 7

  # Publish the verified static bundle to GitHub Pages.
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: full
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-main-${{ github.sha }}
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
