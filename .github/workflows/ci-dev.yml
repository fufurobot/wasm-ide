# Fast feedback for the `dev` integration branch.
#
# The branch model is: fast test on dev, full test on main, publish artifacts
# when a release is pushed. So this workflow deliberately stays cheap — it runs
# the unit suite and a production build, but not the browser suite. Red on dev
# is acceptable and expected; main is where correctness is enforced.
name: CI (dev fast)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Build the npm package
        run: bun run build:lib

      - name: Assert the package entries and declarations exist
        run: |
          set -eu
          for entry in index.js index.cjs index.d.ts vanilla.js vanilla.cjs vanilla.d.ts \
                       types/lib/ide.d.ts coi-serviceworker.js; do
            test -f "dist-lib/$entry" || { echo "::error::dist-lib/$entry is missing"; exit 1; }
          done
          # The vanilla entry must be usable without a bundler: no bare specifiers.
          if grep -nE '^import[^;]*from ?"(@|[a-z])' dist-lib/vanilla.js; then
            echo "::error::vanilla.js has a bare specifier; pages without a bundler cannot load it"
            exit 1
          fi
          # Declarations must not leak the repo-only "@/..." path alias.
          if grep -rl 'from "@/' dist-lib/ --include='*.d.ts'; then
            echo "::error::declarations reference the project alias '@/'"
            exit 1
          fi
          echo "package build looks correct"

      - name: Build static bundle
        run: bun run build

      # Runs after the build: these tests inspect dist/ and would fail on
      # ordering, not correctness, if they ran in the unit phase.
      - name: Built-bundle tests
        run: bun run test:dist

      - name: Assert the isolation worker shipped
        run: |
          set -eu
          test -f dist/coi-serviceworker.js || {
            echo "::error::dist/coi-serviceworker.js is missing; the deployed site cannot become cross-origin isolated"
            exit 1
          }
          grep -q "coi-serviceworker" dist/index.html || {
            echo "::error::the isolation bootstrap is not inlined in dist/index.html"
            exit 1
          }
          echo "isolation worker and bootstrap present"

      - name: Assert no credentials leaked into the bundle
        run: |
          set -eu
          if grep -rIl -E 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}' dist/; then
            echo "::error::a credential-shaped string was found in dist/"
            exit 1
          fi
          echo "dist/ is free of credential-shaped strings"

      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/
          retention-days: 3
